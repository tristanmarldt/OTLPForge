name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION#v}"
          for TARGET in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS=${TARGET%/*}
            GOARCH=${TARGET#*/}
            NAME="otgen_${GOOS}_${GOARCH}"
            echo "→ $GOOS/$GOARCH"
            if [ "$GOOS" = "windows" ]; then
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
                go build -trimpath -ldflags="$LDFLAGS" -o otgen.exe .
              zip "${NAME}.zip" otgen.exe
              rm otgen.exe
            else
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
                go build -trimpath -ldflags="$LDFLAGS" -o otgen .
              tar -czf "${NAME}.tar.gz" otgen
              rm otgen
            fi
          done
          sha256sum otgen_*.tar.gz otgen_*.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            otgen_*.tar.gz
            otgen_*.zip
            checksums.txt
