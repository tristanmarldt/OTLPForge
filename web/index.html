<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTLPForge</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --ink: #171717;
      --muted: #525252;
      --line: #e5e5e5;
      --accent: #1d4ed8;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    h1 { margin: 0 0 6px; font-size: 1.25rem; }
    p { margin: 0; color: var(--muted); font-size: 0.95rem; }

    .row {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      margin-bottom: 8px;
    }

    label {
      display: grid;
      gap: 4px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input, textarea, button { font: inherit; }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fff;
      color: var(--ink);
    }

    input:focus, textarea:focus {
      outline: 2px solid #bfdbfe;
      border-color: var(--accent);
    }

    textarea { min-height: 92px; resize: vertical; }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .primary { background: var(--accent); color: white; }
    .secondary { background: #e5e7eb; color: var(--ink); }
    .danger { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }

    .status {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #fafafa;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      white-space: pre-wrap;
      font-size: 12px;
      max-height: 220px;
      overflow: auto;
    }

    .inline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .statusline {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .hint {
      margin: 4px 0 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 10px;
      color: var(--ink);
      font-size: 0.92rem;
    }

    .checks label {
      display: inline-flex;
      grid-template-columns: none;
      align-items: center;
      gap: 6px;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1>OTLPForge</h1>
      <p>Minimal OTLP sender for Dynatrace. One shared attributes config for all enabled signals.</p>
    </section>

    <section class="panel">
      <div class="row">
        <label>OTLP Endpoint
          <input id="endpoint" placeholder="https://.../api/v2/otlp" />
        </label>
        <label>Token
          <input id="token" placeholder="dt0c01..." type="password" />
        </label>
        <label>Token Header
          <input id="tokenHeader" placeholder="Authorization" />
        </label>
        <label>Interval (seconds)
          <input id="intervalSeconds" type="number" min="1" value="5" />
        </label>
      </div>
      <div id="configHints" class="hint"></div>

      <div class="checks">
        <label><input id="emitSpans" type="checkbox" /> Emit spans</label>
        <label><input id="emitMetrics" type="checkbox" /> Emit metrics</label>
        <label><input id="emitLogs" type="checkbox" /> Emit logs</label>
      </div>

      <label class="inline"><input id="insecureSkipTLS" type="checkbox" /> Skip TLS verification (test only)</label>

      <div class="row">
        <label>Span Name
          <input id="spanName" placeholder="otlpforge.synthetic.span" />
        </label>
        <label>Span Kind
          <input id="spanKind" placeholder="internal | server | client | producer | consumer" />
        </label>
        <label>Min Span Duration (ms)
          <input id="spanMinDurationMs" type="number" min="1" value="20" />
        </label>
        <label>Max Span Duration (ms)
          <input id="spanMaxDurationMs" type="number" min="1" value="80" />
        </label>
        <label>Child Span Count
          <input id="spanChildCount" type="number" min="0" value="0" />
        </label>
      </div>

      <div class="row">
        <label>Span Failure Rate (%)
          <input id="spanFailureRate" type="number" min="0" max="100" value="0" />
        </label>
        <label>Failure Mode
          <input id="spanFailureMode" placeholder="http | timeout | backend" />
        </label>
        <label>Failure HTTP Status Code
          <input id="spanFailureCode" type="number" min="100" max="599" value="500" />
        </label>
        <label>Failure Message
          <input id="spanFailureMessage" placeholder="synthetic request failure" />
        </label>
      </div>

      <div class="row">
        <label>Metric Name
          <input id="metricName" placeholder="otlpforge.synthetic.counter" />
        </label>
        <label>Log Message
          <input id="logMessage" placeholder="Hello from OTLPForge" />
        </label>
      </div>

      <div class="row">
        <label>Resource Attributes JSON (shared)
          <textarea id="resourceAttributes" placeholder='{"service.name":"otlpforge","env":"dev"}'></textarea>
        </label>
      </div>

      <div class="actions">
        <button class="primary" id="saveBtn">Save Config</button>
        <button class="secondary" id="startBtn">Start Sending</button>
        <button class="danger" id="stopBtn">Stop</button>
      </div>
    </section>

    <section class="panel">
      <div class="statusline">
        <strong>Runtime Status</strong>
        <span id="runningText">stopped</span>
      </div>
      <div class="hint">Effective runtime config</div>
      <div id="effectiveConfig" class="status"></div>
      <div style="height:8px"></div>
      <div class="hint">Live signal status</div>
      <div id="status" class="status">Loading...</div>
    </section>
  </div>

  <script>
    const state = {
      config: null,
      effectiveConfig: null,
      status: null,
      sources: {
        endpointFromEnv: false,
        tokenFromEnv: false,
        tokenHeaderFromEnv: false,
      }
    };

    const endpointEl = document.getElementById('endpoint');
    const tokenEl = document.getElementById('token');
    const tokenHeaderEl = document.getElementById('tokenHeader');
    const intervalEl = document.getElementById('intervalSeconds');
    const insecureSkipTLSEl = document.getElementById('insecureSkipTLS');
    const emitSpansEl = document.getElementById('emitSpans');
    const emitMetricsEl = document.getElementById('emitMetrics');
    const emitLogsEl = document.getElementById('emitLogs');
    const spanNameEl = document.getElementById('spanName');
    const spanKindEl = document.getElementById('spanKind');
    const spanMinDurationMsEl = document.getElementById('spanMinDurationMs');
    const spanMaxDurationMsEl = document.getElementById('spanMaxDurationMs');
    const spanChildCountEl = document.getElementById('spanChildCount');
    const spanFailureRateEl = document.getElementById('spanFailureRate');
    const spanFailureModeEl = document.getElementById('spanFailureMode');
    const spanFailureCodeEl = document.getElementById('spanFailureCode');
    const spanFailureMessageEl = document.getElementById('spanFailureMessage');
    const metricNameEl = document.getElementById('metricName');
    const logMessageEl = document.getElementById('logMessage');
    const resourceAttributesEl = document.getElementById('resourceAttributes');
    const statusEl = document.getElementById('status');
    const effectiveConfigEl = document.getElementById('effectiveConfig');
    const runningTextEl = document.getElementById('runningText');
    const configHintsEl = document.getElementById('configHints');

    function parseJsonOrEmpty(value) {
      const trimmed = (value || '').trim();
      if (!trimmed) return {};
      const parsed = JSON.parse(trimmed);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        throw new Error('Expected JSON object');
      }
      return parsed;
    }

    function collectConfig() {
      const next = { ...(state.config || {}) };
      if (!state.sources.endpointFromEnv) next.endpoint = endpointEl.value.trim();
      if (!state.sources.tokenFromEnv) next.token = tokenEl.value.trim();
      if (!state.sources.tokenHeaderFromEnv) next.tokenHeader = tokenHeaderEl.value.trim() || 'Authorization';
      state.config = next;
      state.config.intervalSeconds = Number(intervalEl.value || 5);
      state.config.insecureSkipTLS = !!insecureSkipTLSEl.checked;
      state.config.emitSpans = !!emitSpansEl.checked;
      state.config.emitMetrics = !!emitMetricsEl.checked;
      state.config.emitLogs = !!emitLogsEl.checked;
      state.config.spanName = spanNameEl.value.trim();
      state.config.spanKind = spanKindEl.value.trim();
      state.config.spanMinDurationMs = Number(spanMinDurationMsEl.value || 20);
      state.config.spanMaxDurationMs = Number(spanMaxDurationMsEl.value || 80);
      state.config.spanChildCount = Number(spanChildCountEl.value || 0);
      state.config.spanFailureRate = Number(spanFailureRateEl.value || 0);
      state.config.spanFailureMode = spanFailureModeEl.value.trim();
      state.config.spanFailureCode = Number(spanFailureCodeEl.value || 500);
      state.config.spanFailureMessage = spanFailureMessageEl.value.trim();
      state.config.metricName = metricNameEl.value.trim();
      state.config.logMessage = logMessageEl.value.trim();
      state.config.resourceAttributes = parseJsonOrEmpty(resourceAttributesEl.value);
    }

    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(payload.error || `HTTP ${res.status}`);
      return payload;
    }

    async function save() {
      collectConfig();
      await api('POST', '/api/config', state.config);
      await load();
    }

    function renderStatus() {
      runningTextEl.textContent = state.status?.running ? 'running' : 'stopped';
      effectiveConfigEl.textContent = JSON.stringify({
        endpoint: state.effectiveConfig?.endpoint || '',
        tokenConfigured: !!state.sources.tokenFromEnv || !!state.config?.token,
        tokenHeader: state.effectiveConfig?.tokenHeader || 'Authorization',
        intervalSeconds: state.effectiveConfig?.intervalSeconds || 5,
        endpointSource: state.sources.endpointFromEnv ? 'env' : 'saved config',
        tokenSource: state.sources.tokenFromEnv ? 'env' : (state.config?.token ? 'saved config' : 'not set'),
        tokenHeaderSource: state.sources.tokenHeaderFromEnv ? 'env' : 'saved config'
      }, null, 2);
      statusEl.textContent = JSON.stringify(state.status || {}, null, 2);
    }

    async function load() {
      const data = await api('GET', '/api/config');
      state.config = data.config;
      state.effectiveConfig = data.effectiveConfig || data.config;
      state.status = data.status;
      state.sources.endpointFromEnv = !!data.endpointFromEnv;
      state.sources.tokenFromEnv = !!data.tokenFromEnv;
      state.sources.tokenHeaderFromEnv = !!data.tokenHeaderFromEnv;

      endpointEl.value = state.sources.endpointFromEnv ? (state.effectiveConfig.endpoint || '') : (state.config.endpoint || '');
      tokenEl.value = '';
      tokenHeaderEl.value = state.sources.tokenHeaderFromEnv ? (state.effectiveConfig.tokenHeader || 'Authorization') : (state.config.tokenHeader || 'Authorization');
      intervalEl.value = state.config.intervalSeconds || 5;
      insecureSkipTLSEl.checked = !!state.config.insecureSkipTLS;
      emitSpansEl.checked = !!state.config.emitSpans;
      emitMetricsEl.checked = !!state.config.emitMetrics;
      emitLogsEl.checked = !!state.config.emitLogs;
      spanNameEl.value = state.config.spanName || '';
      spanKindEl.value = state.config.spanKind || 'internal';
      spanMinDurationMsEl.value = state.config.spanMinDurationMs || 20;
      spanMaxDurationMsEl.value = state.config.spanMaxDurationMs || 80;
      spanChildCountEl.value = state.config.spanChildCount || 0;
      spanFailureRateEl.value = state.config.spanFailureRate || 0;
      spanFailureModeEl.value = state.config.spanFailureMode || 'http';
      spanFailureCodeEl.value = state.config.spanFailureCode || 500;
      spanFailureMessageEl.value = state.config.spanFailureMessage || '';
      metricNameEl.value = state.config.metricName || '';
      logMessageEl.value = state.config.logMessage || '';
      resourceAttributesEl.value = JSON.stringify(state.config.resourceAttributes || {}, null, 2);
      endpointEl.readOnly = state.sources.endpointFromEnv;
      tokenEl.readOnly = state.sources.tokenFromEnv;
      tokenHeaderEl.readOnly = state.sources.tokenHeaderFromEnv;
      endpointEl.title = state.sources.endpointFromEnv ? 'Set by OTLPFORGE_ENDPOINT' : '';
      tokenEl.title = state.sources.tokenFromEnv ? 'Set by OTLPFORGE_TOKEN' : '';
      tokenHeaderEl.title = state.sources.tokenHeaderFromEnv ? 'Set by OTLPFORGE_TOKEN_HEADER' : '';
      tokenEl.placeholder = data.tokenConfigured ? (state.sources.tokenFromEnv ? 'provided by env' : 'configured') : 'dt0c01...';
      const hints = [];
      if (data.endpointFromEnv) hints.push('endpoint overridden by env');
      if (data.tokenFromEnv) hints.push('token overridden by env');
      if (data.tokenHeaderFromEnv) hints.push('token header overridden by env');
      if (data.tokenConfigured && !data.tokenFromEnv) hints.push('saved token configured');
      configHintsEl.textContent = hints.join(' | ');
      renderStatus();
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      try {
        await save();
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        await save();
        await api('POST', '/api/start');
        await load();
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById('stopBtn').addEventListener('click', async () => {
      try {
        await api('POST', '/api/stop');
        await load();
      } catch (err) {
        alert(err.message);
      }
    });

    setInterval(async () => {
      try {
        const data = await api('GET', '/api/status');
        state.status = data;
        renderStatus();
      } catch (_) {}
    }, 2500);

    load().catch(err => {
      statusEl.textContent = err.message;
    });
  </script>
</body>
</html>
